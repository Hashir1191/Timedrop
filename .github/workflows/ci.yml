name: TimeDrop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: timedrop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      PYTHONPATH: backend
      APP_ENV: development
      DATABASE_URL: sqlite:///./timedrop-ci.db
      SECRET_KEY: ci-only-secret-key-not-for-deployment
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend test suite
        run: python -m pytest backend/tests -v

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  production-compose-validation:
    name: Production Compose configuration
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: timedrop_ci
      POSTGRES_USER: timedrop_ci
      POSTGRES_PASSWORD: ci-only-url-safe-password
      TIMEDROP_API_IMAGE: ghcr.io/example/timedrop-api:ci
      TIMEDROP_WEB_IMAGE: ghcr.io/example/timedrop-web:ci
      SECRET_KEY: ci-only-secret-key-not-for-deployment
      CORS_ORIGINS: https://timedrop.example.invalid
      TRUSTED_HOSTS: timedrop.example.invalid,127.0.0.1
      NOTIFICATION_FROM_EMAIL: "TimeDrop <ci@example.invalid>"
      ROUTE_PROVIDER_USER_AGENT: "TimeDrop/CI (contact: ci@example.invalid)"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Check backup and restore script syntax
        run: bash -n scripts/backup_postgres.sh scripts/restore_postgres_backup.sh

  postgres-migrations:
    name: PostgreSQL migration integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: timedrop_ci
          POSTGRES_USER: timedrop_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timedrop_ci -d timedrop_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: backend
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://timedrop_ci:ci-only-postgres-password@localhost:5432/timedrop_ci
      SECRET_KEY: ci-only-secret-key-not-for-deployment
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Apply all Alembic migrations to PostgreSQL
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Verify database migration revision
        run: python -m alembic -c backend/alembic.ini current

      - name: Confirm migration upgrade is idempotent
        run: python -m alembic -c backend/alembic.ini upgrade head

  docker-image-builds:
    name: Production Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: timedrop-api:ci
          cache-from: type=gha,scope=timedrop-api-ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=/api/v1
          push: false
          load: true
          tags: timedrop-web:ci
          cache-from: type=gha,scope=timedrop-web-ci

      - name: Validate Nginx configuration with service DNS stub
        run: docker run --rm --add-host api:127.0.0.1 timedrop-web:ci nginx -t

  workflow-yaml-validation:
    name: GitHub Actions workflow validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Parse CI and release workflows
        run: |
          python - <<'PY'
          import yaml

          for path in (
              ".github/workflows/ci.yml",
              ".github/workflows/release-images.yml",
          ):
              with open(path, encoding="utf-8") as stream:
                  yaml.load(stream, Loader=yaml.BaseLoader)
              print(f"Validated {path}")
          PY
