name: TimeDrop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: timedrop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      PYTHONPATH: backend
      APP_ENV: development
      DATABASE_URL: sqlite:///./timedrop-ci.db
      SECRET_KEY: ci-only-secret-key-not-for-deployment
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend test suite
        run: python -m pytest backend/tests -v

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  production-compose-validation:
    name: Production Compose configuration
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: timedrop_ci
      POSTGRES_USER: timedrop_ci
      POSTGRES_PASSWORD: ci-only-url-safe-password
      SECRET_KEY: ci-only-secret-key-not-for-deployment
      CORS_ORIGINS: https://timedrop.example.invalid
      NOTIFICATION_FROM_EMAIL: TimeDrop <ci@example.invalid>
      ROUTE_PROVIDER_USER_AGENT: TimeDrop/CI (contact: ci@example.invalid)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.production.yml config --quiet
