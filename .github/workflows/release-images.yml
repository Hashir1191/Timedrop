name: TimeDrop Release Images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: timedrop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish production images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize registry namespace
        id: image-owner
        run: echo "owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate API image tags
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image-owner.outputs.owner }}/timedrop-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=timedrop-api
          cache-to: type=gha,mode=max,scope=timedrop-api
          sbom: true
          provenance: mode=max

      - name: Generate web image tags
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image-owner.outputs.owner }}/timedrop-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: Dockerfile
          build-args: |
            VITE_API_BASE_URL=/api/v1
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=timedrop-web
          cache-to: type=gha,mode=max,scope=timedrop-web
          sbom: true
          provenance: mode=max
