services:
  db:
    image: postgres:16-alpine
    container_name: timedrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timedrop}
      POSTGRES_USER: ${POSTGRES_USER:-timedrop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timedrop_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timedrop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timedrop_user} -d ${POSTGRES_DB:-timedrop}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: timedrop-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-TimeDrop API}
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-timedrop_user}:${POSTGRES_PASSWORD:-timedrop_dev_password}@db:5432/${POSTGRES_DB:-timedrop}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-this-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  timedrop_postgres_data:
