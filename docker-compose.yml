services:
  db:
    image: postgres:16-alpine
    container_name: timedrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timedrop}
      POSTGRES_USER: ${POSTGRES_USER:-timedrop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timedrop_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timedrop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timedrop_user} -d ${POSTGRES_DB:-timedrop}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: timedrop-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-TimeDrop API}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-timedrop_user}:${POSTGRES_PASSWORD:-timedrop_dev_password}@db:5432/${POSTGRES_DB:-timedrop}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-this-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-TimeDrop <onboarding@resend.dev>}
      NOTIFICATION_WORKER_POLL_SECONDS: ${NOTIFICATION_WORKER_POLL_SECONDS:-5}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_FLOW_TEMPLATE_ID: ${MSG91_FLOW_TEMPLATE_ID:-}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID:-}
      SMS_NOTIFICATIONS_ENABLED: ${SMS_NOTIFICATIONS_ENABLED:-false}
      PHONE_OTP_EXPOSE_IN_DEVELOPMENT: ${PHONE_OTP_EXPOSE_IN_DEVELOPMENT:-true}
      PHONE_OTP_EXPIRE_MINUTES: ${PHONE_OTP_EXPIRE_MINUTES:-5}
      PHONE_OTP_MAX_ATTEMPTS: ${PHONE_OTP_MAX_ATTEMPTS:-5}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
  notification-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: timedrop-notification-worker
    restart: unless-stopped
    command: ["python", "-m", "app.notification_worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-timedrop_user}:${POSTGRES_PASSWORD:-timedrop_dev_password}@db:5432/${POSTGRES_DB:-timedrop}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-this-secret}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-TimeDrop <onboarding@resend.dev>}
      NOTIFICATION_WORKER_POLL_SECONDS: ${NOTIFICATION_WORKER_POLL_SECONDS:-5}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_FLOW_TEMPLATE_ID: ${MSG91_FLOW_TEMPLATE_ID:-}
      SMS_NOTIFICATIONS_ENABLED: ${SMS_NOTIFICATIONS_ENABLED:-false}
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
volumes:
  timedrop_postgres_data:
